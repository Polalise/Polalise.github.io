name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types and content
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Audit source and public assets
        run: npm run audit

      - name: Build and audit public output
        run: npm run build

      - name: Install browser for page checks
        run: npx playwright install --with-deps chromium

      - name: Run browser checks
        run: npm run test:browser

      - name: Run Lighthouse thresholds
        run: npm run test:lighthouse
        env:
          CHROME_PATH: /usr/bin/google-chrome

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install, validate, build, and upload
        uses: withastro/action@v6
        with:
          node-version: 24
          build-cmd: npm run build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
